    <!-- ── Google Analytics 4 (gtag.js) ──────────────────────────────
         The measurement id is injected at build time from
         VITE_GA_MEASUREMENT_ID (see .env). If it is missing or malformed the
         tag is never requested, so local and preview builds stay out of your
         reports instead of polluting them.

         send_page_view is false on purpose: this is a single-page app, so
         React Router navigations are not page loads. Page views are sent by
         usePageTracking() (src/hooks/usePageTracking.ts), which covers every
         route — including /services, /gallery, /faq and /packages. Turning
         the automatic hit back on would double-count the first page. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }

      (function () {
        // measurementId is set at runtime from window.__GA_ID__ if injected by a build step,
        // or remains empty so the block exits silently in dev / preview builds.
        var measurementId = (typeof window !== 'undefined' && window.__GA_ID__) || '';
        if (!/^G-[A-Z0-9]{4,}$/i.test(measurementId)) return;

        window.__GA_MEASUREMENT_ID__ = measurementId;

        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + measurementId;
        document.head.appendChild(tag);

        gtag('js', new Date());
        gtag('config', measurementId, { send_page_view: false });
      })();
    </script>

    <!-- ── BreadcrumbList Schema ──────────────────────────────────────
         Injected per route at runtime by useBreadcrumbSchema()
         (src/hooks/useBreadcrumbSchema.ts), as an application/ld+json
         script tag marked with data-breadcrumb-schema.

         A static list used to live here, but it described a flat nav menu
         (Home, Services, Gallery, Book Appointment) instead of the hierarchy
         of the page being viewed, and it shipped on every URL. Google needs
         one breadcrumb trail that matches the current page, e.g.
         Home > Packages on /packages — hence the dynamic version.
         Please don't re-add a hard-coded trail here: two competing lists on
         one page make it ineligible for the breadcrumb rich result. -->

    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
